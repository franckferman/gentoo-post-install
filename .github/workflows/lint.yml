name: Lint

on:
  push:
    branches: ["stable"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck & syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check (make syntax)
        run: make syntax

      - name: ShellCheck (make lint)
        run: make lint

      - name: Smoke test (--version / --list-steps / dry-run help)
        run: |
          bash gentoo-post-install.sh --version
          bash gentoo-post-install.sh --list-steps
          bash gentoo-post-install.sh --help >/dev/null

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit tests (make test)
        run: make test

      - name: Integration tests (make integration)
        run: make integration

      - name: Dry-run every profile (make profiles)
        run: make profiles

      - name: Dry-run smoke matrix (make smoke)
        run: make smoke
